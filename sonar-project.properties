sonar.projectKey=excalibur-v2
sonar.projectName=Excalibur v2 (SE327)
sonar.projectVersion=2.0

sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,frontend/src/test
sonar.test.inclusions=backend/test/**,frontend/src/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,frontend/src/test/**
sonar.sourceEncoding=UTF-8

# Coverage from `npm run coverage` in backend/ and frontend/ (run both before scanning)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.coverage.exclusions=backend/src/server.js,frontend/src/main.jsx

# The SQL seed is data, not code
sonar.cpd.exclusions=backend/db/**
